[package]
name = "gpui-mobile-example"
version = "0.1.0"
edition = "2021"
description = "Cross-platform GPUI example app for Android and iOS"
publish = false

[lib]
name = "gpui_mobile_example"
crate-type = ["cdylib", "staticlib", "lib"]
path = "src/lib.rs"

[[bin]]
name = "gpui-example"
path = "src/main.rs"

[dependencies]
# Pin the mobile facade support without requiring a published crate.
gpui-kit = { git = "https://github.com/Bombatomica64/gpui-kit", rev = "ba3030b865579826cee51b9eb175364e5c4736e4", default-features = false, features = ["component"] }
gpui-mobile = { package = "gpui-pre-mobile", path = "..", version = "0.1.0" }
gpui = { package = "gpui-pre", version = "=0.3.13", default-features = false }
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.13" }
reqwest = { package = "gpui-pre-reqwest", version = "0.12.15", default-features = false, features = ["rustls-tls"] }
log = "0.4"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
android-activity = { version = "0.6", features = ["native-activity"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

# Patches in the gpui-mobile manifest don't reach this app, so it repeats them:
# the fork's vendored gpui-pre-wgpu, and Bombatomica64/gpui-pre for
# `TextInputConfiguration::purpose` and the touch fixes Kit's fork uses.
[patch.crates-io]
gpui-pre-wgpu = { path = "../vendor/gpui-pre-wgpu" }
gpui-pre = { git = "https://github.com/Bombatomica64/gpui-pre", branch = "mobile-lab-0.3.13" }
